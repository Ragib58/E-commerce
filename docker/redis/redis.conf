# Redis configuration.
#
# This instance serves three roles on separate logical databases:
#   DB 0 -> cache    (volatile, safe to evict)
#   DB 1 -> sessions (must NOT be evicted — eviction logs admins out)
#   DB 2 -> queues   (must NOT be evicted — eviction loses jobs)
#
# Because sessions and jobs share the instance with the cache, the eviction
# policy is `noeviction` rather than `allkeys-lru`: silently dropping a queued
# job to make room for a cache entry would be data loss. Laravel's cache
# entries carry TTLs and expire on their own.
#
# If cache pressure ever requires LRU eviction, split sessions and queues onto
# a second Redis instance first.

bind 0.0.0.0
protected-mode no
port 6379

maxmemory 512mb
maxmemory-policy noeviction

# Persistence: AOF with per-second fsync. Queued jobs and sessions must
# survive a restart; RDB-only snapshots would lose everything since the last
# save point.
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
dir /data

# RDB snapshots retained alongside AOF for fast full restores.
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

timeout 0
tcp-keepalive 300

databases 16

loglevel notice
logfile ""

# Surface commands slower than 10ms for diagnosis.
slowlog-log-slower-than 10000
slowlog-max-len 128
