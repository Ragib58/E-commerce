; PHP-FPM pool configuration.
; Loaded as php-fpm.d/zz-www.conf so it overrides the packaged www.conf.

[www]
user = app
group = app

listen = 0.0.0.0:9000
listen.owner = app
listen.group = app

; `dynamic` suits a container with a fixed CPU allocation: idle workers are
; reaped, but a burst does not wait for process spawn.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recycle workers periodically to bound the impact of any slow memory leak in
; a long-lived process.
pm.max_requests = 500

; Exposes a JSON status page for monitoring. Not routed publicly by Nginx.
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Forward worker output to the container's stderr rather than a file inside
; the container, which would be lost on restart.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; Log any request slower than this with a stack trace — the cheapest way to
; find a runaway query in production.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s

request_terminate_timeout = 60s

clear_env = no
