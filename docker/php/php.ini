; Application PHP configuration.
; Loaded as conf.d/99-app.ini so it overrides the distribution defaults.

memory_limit = 512M

; Must be >= the Nginx client_max_body_size, otherwise PHP rejects an upload
; Nginx already accepted and the client sees a confusing empty response.
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20

max_execution_time = 60
max_input_time = 60
max_input_vars = 3000

; Log to stderr so the container runtime collects them; never display errors
; in a response body, where they leak paths and credentials.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

expose_php = Off

date.timezone = UTC

realpath_cache_size = 4096K
realpath_cache_ttl = 600

[session]
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
