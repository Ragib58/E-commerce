; OPcache — production stage only.
; Enabled where application code is immutable (baked into the image); the
; development stage omits this file so edits take effect immediately.

opcache.enable = 1
opcache.enable_cli = 0

opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; The code cannot change within a container's lifetime, so stat() calls on
; every include are pure overhead. A deploy replaces the container.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

opcache.save_comments = 1
opcache.fast_shutdown = 1

opcache.jit = tracing
opcache.jit_buffer_size = 128M
