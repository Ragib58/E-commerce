; Xdebug — development stage only.
; Mode is off by default (set in the Dockerfile) because enabling Xdebug costs
; roughly a 2x slowdown on every request. Override per-run:
;   docker compose run -e XDEBUG_MODE=debug php ...

xdebug.mode = ${XDEBUG_MODE}

; `client_host` points back at the host machine from inside the container.
; host.docker.internal resolves on Docker Desktop (Windows/macOS); on Linux
; the compose file adds an extra_hosts entry to provide it.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = trigger
xdebug.idekey = PHPSTORM
xdebug.log_level = 0
xdebug.max_nesting_level = 512
