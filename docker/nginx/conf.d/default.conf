###############################################################################
# Upstreams
###############################################################################
upstream php_backend {
    server php:9000;
    keepalive 16;
}

upstream nextjs_frontend {
    server frontend:3000;
    keepalive 32;
}

###############################################################################
# Edge server
#
# One origin fronts both tiers, which removes CORS from the browser's path in
# production entirely:
#   /api/*, /admin/*, /storage/*, /up  -> Laravel (PHP-FPM)
#   everything else                    -> Next.js
###############################################################################
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Generate a request id when the client did not supply one, so a single
    # request can be traced across Nginx, Laravel, and the log collector.
    set $request_id_final $http_x_request_id;
    if ($request_id_final = "") {
        set $request_id_final $request_id;
    }

    # Security headers. CSP is intentionally omitted here — it belongs to the
    # Next.js layer, which knows its own script/style origins.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Request-Id              $request_id_final always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    ###########################################################################
    # Laravel — API
    ###########################################################################
    location /api {
        limit_req zone=api burst=60 nodelay;
        try_files $uri /index.php?$query_string;
    }

    ###########################################################################
    # Laravel — admin panel
    ###########################################################################
    location /admin {
        limit_req zone=admin burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Framework health endpoint (Laravel's built-in /up).
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    ###########################################################################
    # Admin-uploaded assets served from the public disk
    ###########################################################################
    location /storage {
        alias /var/www/html/storage/app/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    ###########################################################################
    # PHP-FPM
    ###########################################################################
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_backend;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTP_X_REQUEST_ID $request_id_final;
        # Laravel must know the original scheme to build correct absolute URLs
        # when TLS is terminated upstream.
        fastcgi_param HTTPS $https if_not_empty;

        fastcgi_hide_header X-Powered-By;

        fastcgi_buffer_size       32k;
        fastcgi_buffers           16 32k;
        fastcgi_read_timeout      60s;
        fastcgi_connect_timeout   10s;

        internal;
    }

    # Any other .php path is not a valid entry point — refuse rather than
    # letting an uploaded file be executed.
    location ~ \.php$ {
        return 404;
    }

    ###########################################################################
    # Next.js build output — content-hashed, so cache immutably
    ###########################################################################
    location /_next/static {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    ###########################################################################
    # Next.js — everything else, including the storefront and HMR websocket
    ###########################################################################
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;

        # Required for the dev-server HMR websocket to survive the proxy.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-Id      $request_id_final;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_cache_bypass    $http_upgrade;
    }

    # Deny access to dotfiles, except the ACME challenge path used by certbot.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
