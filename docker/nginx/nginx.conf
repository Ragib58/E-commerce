user  nginx;
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON access logs so a log collector can parse them without a regex.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"request_id":"$http_x_request_id",'
        '"referer":"$http_referer",'
        '"agent":"$http_user_agent"'
    '}';

    access_log /dev/stdout json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout   65;
    client_max_body_size 20M;
    client_body_timeout  60s;
    client_header_timeout 60s;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Rate limit zones. Applied per-location; the API zone is deliberately
    # generous because Laravel enforces the real per-client budget — this is
    # only a coarse guard against a flood reaching PHP at all.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/s;

    # Maps the Upgrade header to the correct Connection value: "upgrade" for a
    # websocket handshake, empty otherwise so keepalive is preserved. Declared
    # here so it is defined before any conf.d server block references it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
